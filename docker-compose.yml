version: '3.8'

services:
  # API Spring Boot
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loteria-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DATABASE_URL=jdbc:postgresql://postgres:5432/loteria
      - DATABASE_USER=loteria
      - DATABASE_PASSWORD=loteria
      - WORKER_ENABLED=false
      - INTERNAL_SYNC_KEY=dev-secret-change-in-prod
      - TZ=America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # PostgreSQL (local dev - usa Neon em produção)
  postgres:
    image: postgres:16-alpine
    container_name: loteria-postgres
    environment:
      - POSTGRES_DB=loteria
      - POSTGRES_USER=loteria
      - POSTGRES_PASSWORD=loteria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loteria -d loteria"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: