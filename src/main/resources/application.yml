# ============================================================
# Loteria API - Configuração Spring Boot 3 + Java 21
# ============================================================

server:
  port: 8080
  address: 0.0.0.0
  # context-path removido para permitir /api (Heroku compat) e /api/v1 (endpoints originais)
  # Controllers usam @RequestMapping com prefixo próprio

spring:
  # Desabilita throw-exception-if-no-handler-found para permitir resource handlers funcionarem
  # O filtro ApiNotFoundFilter captura 404 para rotas de API
  mvc:
    throw-exception-if-no-handler-found: false
  web:
    resources:
      add-mappings: true

  application:
    name: loteria-api

  # ------------------------------------------------------------------
  # DataSource (Neon PostgreSQL) - credenciais via ENV
  # Use DATABASE_URL sem credenciais (só host/db) + DATABASE_USER/DATABASE_PASSWORD separados
  # Ex: DATABASE_URL=jdbc:postgresql://ep-xxx.neon.tech/neondb?sslmode=require
  #     DATABASE_USER=neondb_owner
  #     DATABASE_PASSWORD=npg_xxx@xxx
  # ------------------------------------------------------------------
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      # Neon pooler closes idle connections ~30-60s; keep Hikari timeouts shorter
      idle-timeout: 30000          # 30s (was 5min) - evict idle before pooler closes
      max-lifetime: 60000          # 60s (was 20min) - recycle before pooler kills
      leak-detection-threshold: 60000
      # Validation: Hikari 5+ uses JDBC4 isValid() automatically
      # For older drivers, uncomment: connection-test-query: SELECT 1
      data-source-properties:
        sslmode: require
        channel_binding: require
        # TCP keepalive to detect dead connections faster
        tcpKeepAlive: true
        tcpKeepAliveIdle: 30
        tcpKeepAliveInterval: 10

  # ------------------------------------------------------------------
  # JPA / Hibernate
  # ------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate  # usa Flyway para migrations
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        cache:
          use_second_level_cache: false
          use_query_cache: false

  # ------------------------------------------------------------------
  # Flyway (migrations)
  # ------------------------------------------------------------------
  flyway:
    enabled: false  # Disabled for local dev (schema created by ETL); enable in prod with Flyway 11.12+ for pgjdbc 42.7+
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  # ------------------------------------------------------------------
  # Cache (Spring Cache + Caffeine) - RNF02
  # ------------------------------------------------------------------
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=3600s,recordStats

  # ------------------------------------------------------------------
  # Jackson (serialização JSON)
  # ------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    property-naming-strategy: SNAKE_CASE

  # ------------------------------------------------------------------
  # HTTP Client (RestClient) - RNF05 (timeouts, retry)
  # ------------------------------------------------------------------
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

# ============================================================
# Configurações customizadas da aplicação
# ============================================================
loteria:
  # Worker de coleta automática (RF03-RF06)
  worker:
    enabled: ${WORKER_ENABLED:true}
    # Dias de sorteio por modalidade (0=Dom ... 6=Sáb)
    # Fonte: calendário oficial Caixa
    dias-sorteio:
      megasena: [2, 4, 6]       # Ter, Qui, Sáb
      lotofacil: [1, 2, 3, 4, 5, 6] # Seg a Sáb
      quina: [1, 2, 3, 4, 5, 6]     # Seg a Sáb
      lotomania: [2, 4, 6]          # Ter, Qui, Sáb
      timemania: [1, 3, 5]          # Seg, Qua, Sex
      duplasena: [1, 3, 5]          # Seg, Qua, Sex
      super7: [1, 3, 5]             # Seg, Qua, Sex
      loteca: [6]                   # Sáb (apuração)
    # Janela de apuração (BRT)
    janela-apuracao-inicio: "20:00"
    janela-apuracao-fim: "22:30"
    # Polling frequência (segundos)
    polling-interval-segundos: 30
    # Timeout HTTP para API da Caixa
    http-timeout-segundos: 10
    # Max retries com backoff exponencial
    max-retries: 3
    # User-Agent para evitar bloqueio WAF (RNF04)
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

  # API Externa da Caixa (RF03)
  caixa-api:
    base-url: "https://servicebus2.caixa.gov.br/portaldeloterias/api"
    endpoints:
      modalidade: "/{modalidade}"
      concurso: "/{modalidade}/{concurso}"

  # Endpoint interno de sincronização (RF10)
  internal-sync:
    enabled: true
    # Chave compartilhada via ENV: INTERNAL_SYNC_KEY
    header-name: "X-Internal-Sync-Key"

# ============================================================
# Cache personalizado (nomes dos caches usados no Repository)
# ============================================================
cache:
  names:
    - latestResultado
    - resultadoPorConcurso
    - modalidades
    - herokuModalidades

# ============================================================
# Actuator / Health / Metrics
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

# ============================================================
# Logging
# ============================================================
logging:
  level:
    com.loteria.api: DEBUG
    org.springframework.cache: DEBUG
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================================================
# SpringDoc OpenAPI / Swagger
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  packages-to-scan: com.loteria.api.controller
  paths-to-match: /api/**,/api/v1/**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json