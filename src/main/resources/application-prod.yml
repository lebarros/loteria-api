# ============================================================
# Production Profile Overrides
# Activated via SPRING_PROFILES_ACTIVE=prod
# ============================================================

logging:
  level:
    com.loteria.api: INFO
    org.springframework.cache: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

# Ensure Flyway runs migrations in production (schema validation)
spring:
  flyway:
    enabled: true
    validate-on-migrate: true

# Disable worker in web service (run separately if needed)
loteria:
  worker:
    enabled: false

# Render injects PORT env var (default 8080)
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# Actuator health details for Render health checks
management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true