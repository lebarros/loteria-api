# fly.toml app configuration file generated for loteria-api on 2026-11-25T13:50:09-03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'loteria-api'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

  [env]
    SPRING_PROFILES_ACTIVE = "prod"
    WORKER_ENABLED = "false"
    # Database (set as secrets instead - see Option 2)
    # DATABASE_URL = "..."
    # DATABASE_USER = "..."
    # DATABASE_PASSWORD = "..."
    # INTERNAL_SYNC_KEY = "..."