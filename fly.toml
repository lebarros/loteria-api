# fly.toml - Loteria API otimizado para Fly.io Free Tier (256MB RAM)
# Otimizado para scale-to-zero nativo + alta disponibilidade + baixo recurso

app = 'loteria-api'
primary_region = 'gru'                     # São Paulo (menor latência para Neon SA)

[build]
  # Usa Dockerfile otimizado (multi-stage + distroless)
  dockerfile = 'Dockerfile'

[env]
  SPRING_PROFILES_ACTIVE = "fly"           # Profile específico Fly
  JAVA_OPTS = "-Xms48m -Xmx180m -XX:MaxRAMPercentage=70 -XX:+UseZGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom -XX:CICompilerCount=1"
  # Secrets (configure via `fly secrets set`):
  # DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD, INTERNAL_SYNC_KEY

# Scale-to-zero nativo (free tier) - configuração completa do serviço
[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["app"]

  # Scale-to-zero (free tier)
  auto_stop_machines = 'stop'              # Para máquina sem tráfego
  auto_start_machines = true               # Inicia ao receber request
  min_machines_running = 0                 # Zero máquinas rodando (free tier)

  # Concurrency limits - evita OOM sob carga
  [services.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  # Health check HTTP (não port scan) - rápido para autostart
  [services.http_checks]
    interval = "10s"
    grace_period = "10s"                   # Tempo para cold start
    method = "GET"
    path = "/api/v1/actuator/health"
    timeout = "3s"
    tls_skip_verify = false

  # Ports HTTP/HTTPS
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

# VM config - Free tier: 256MB RAM, 1 shared CPU
[[vm]]
  memory = '256mb'                         # Free tier limit
  cpu_kind = 'shared'
  cpus = 1

# Metrics (opcional - para Grafana Cloud free)
[metrics]
  port = 9091
  path = "/metrics"

# Release command (migrações Flyway se necessário)
# [release]
#   cmd = "java -jar app.jar flyway migrate"